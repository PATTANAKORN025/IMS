# IMS Alertmanager Configuration — Phase 1: Alert Fatigue Mitigation
# Grouping by device_id + device_type ensures all anomalies for a single
# machine arrive as ONE notification, not N separate alerts.

global:
  resolve_timeout: 5m

route:
  receiver: 'ims-webhook-default'
  # Group by device identity so all alerts for one machine bundle together
  group_by: ['alertname', 'device_id', 'device_type']
  group_wait: 30s        # Wait 30s to collect initial burst before first notify
  group_interval: 5m     # Don't re-notify same group more than once per 5m
  repeat_interval: 4h    # Re-notify unresolved alerts every 4h (NOC shift handover)
  routes:
    # Watchdog deadman goes to null (standard Prometheus convention)
    - matchers:
        - alertname="Watchdog"
      receiver: 'null'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

    # Critical: page immediately, short repeat for awareness
    - matchers:
        - severity="critical"
      receiver: 'ims-slack-critical'
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 30m
      continue: true

    # Warning: standard NOC notification
    - matchers:
        - severity="warning"
      receiver: 'ims-webhook-default'
      group_wait: 30s
      group_interval: 10m
      repeat_interval: 2h

    # Info: dashboard-only, minimal notification
    - matchers:
        - severity="info"
      receiver: 'ims-webhook-default'
      group_interval: 30m
      repeat_interval: 24h

receivers:
  - name: 'null'

  - name: 'ims-webhook-default'
    webhook_configs:
      - url: 'http://node-red:1880/alert-webhook'
        send_resolved: true
        http_config:
          follow_redirects: true

  - name: 'ims-slack-critical'
    # This receiver's only working delivery path is webhook_configs below,
    # which forwards to Node-RED's /alert-webhook -- from there it fans out
    # to LINE Messaging API / MS Teams (nodered_data/flows/alerting.json),
    # already correctly implemented, just needs LINE_CHANNEL_ACCESS_TOKEN /
    # LINE_USER_ID / TEAMS_WEBHOOK_URL set in .env to actually deliver.
    #
    # A slack_configs block used to live here pointing at a literal
    # placeholder URL (https://hooks.slack.com/services/YOUR/WEBHOOK/URL) --
    # Alertmanager would attempt and fail that delivery on every single
    # critical alert. Removed rather than left as dead-on-arrival config. To
    # add real Slack delivery, add back a slack_configs block with a real
    # api_url (webhook URLs can't be templated from an env var here --
    # Alertmanager's config file has no runtime variable substitution).
    webhook_configs:
      - url: 'http://node-red:1880/alert-webhook'
        send_resolved: true


inhibit_rules:
  # A down service suppresses its own latency/SLA warnings
  - source_matchers:
      - alertname="ServiceDown"
    target_matchers:
      - alertname=~"ServiceHighLatency|SLABreachWarning"
    equal: ['instance']

  # Any critical on a device suppresses warnings on the same device
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['device_id']

  # Network-down suppresses bandwidth alerts on same device
  - source_matchers:
      - alertname="InterfaceDown"
    target_matchers:
      - alertname="BandwidthSaturation"
    equal: ['device_id']
