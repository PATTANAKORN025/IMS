# IMS Grafana Security Configuration
# Zero-Trust Dashboard Access for NOC Screens

[database]
type = sqlite3
path = grafana.db
cache_mode = private
# wal = true is set, but on 2026-09-25 (Grafana 13.1.2, modernc SQLite driver) the file header
# still read rollback-journal mode (bytes 18-19 = 1,1) and no grafana.db-wal existed, so it is
# not in effect yet. busy_timeout is not a Grafana [database] option and was removed; lock
# contention is retried by transaction_retries (default 10).
wal = true

[security]
disable_sanitize_html = false
cookie_secure = false
cookie_samesite = lax
allow_embedding = true
# Hide Grafana version from footer
hide_version = true

[users]
allow_sign_up = false
default_theme = dark
# Viewers cannot edit dashboards
viewers_can_edit = false

[auth.anonymous]
enabled = false

[panels]
disable_sanitize_html = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/ims-noc-overview.json

[explore]
# Disable Explore for non-admin users (prevent SQL injection)
enabled = false

[plugins]
# Disable unsigned plugin loading
allow_loading_unsigned_plugins = []
# Prevent plugin installation via UI
hide_new_plugins = true

[unified_alerting]
enabled = true

[feature_toggles]
# JWT-based render auth (default-on in 13.x) 401s against the external
# grafana-image-renderer container's callback request; classic cookie-based
# render-key auth (the path the external renderer expects) works.
renderAuthJWT = false

[log]
level = warn
mode = console

[server]
enable_gzip = true
