# IMS Grafana configuration (Grafana 13.1.x)
#
# This file is the single source of truth for Grafana behaviour. docker-compose.yaml
# passes only what is secret or differs per deployment (admin credentials, root_url,
# renderer URL and token) as GF_<SECTION>_<KEY> variables, which override this file.
# Every key below exists in the image's own conf/defaults.ini; a key Grafana does not
# know is silently ignored, which is how hide_version once sat in the wrong section.

[server]
enable_gzip = true
router_logging = false

[database]
type = sqlite3
path = grafana.db
cache_mode = private
# wal = true is set, but on 2026-09-25 (Grafana 13.1.2, modernc SQLite driver) the file header
# still read rollback-journal mode (bytes 18-19 = 1,1) and no grafana.db-wal existed, so it is
# not in effect yet. Lock contention is retried by transaction_retries (default 10).
wal = true

[dataproxy]
# A query slower than this is a bug to fix, not a timeout to raise.
timeout = 30

[security]
disable_initial_admin_creation = false
# Plain-HTTP front door: a Secure cookie would never come back from another machine.
# Turn cookie_secure and strict_transport_security on together once ims-proxy terminates TLS.
cookie_secure = false
cookie_samesite = lax
strict_transport_security = false
# Grafana is never framed by another site; nginx also sends X-Frame-Options SAMEORIGIN.
allow_embedding = false
# No request to gravatar.com per user avatar (offline plant network; it also leaks e-mail hashes).
disable_gravatar = true
# The data source proxy may only reach the stack's own back ends (SSRF guard against
# anyone who can add a data source).
data_source_proxy_whitelist = ims-pgbouncer:5432 timescaledb:5432 prometheus:9090
disable_brute_force_login_protection = false
x_content_type_options = true
# nginx sends X-XSS-Protection: 0 (the old browser filter does more harm than good).
x_xss_protection = false
# Grafana's default policy with a per-request nonce, minus grafana.com (nothing here calls it)
# and plus frame-ancestors. 'unsafe-eval' stays: Business Text afterRender and the ECharts
# panel compile their code with new Function().
content_security_policy = true
content_security_policy_template = """script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $NONCE;object-src 'none';font-src 'self';style-src 'self' 'unsafe-inline' blob:;img-src * data:;base-uri 'self';connect-src 'self' ws://$ROOT_PATH wss://$ROOT_PATH;manifest-src 'self';media-src 'none';form-action 'self';frame-ancestors 'self';"""

[snapshots]
# Local snapshots stay; publishing to snapshots.raintank.io (the default) would copy
# plant data to a third party with one click.
enabled = true
external_enabled = false

[public_dashboards]
# "Shared dashboards" give anyone with the link access without a login.
enabled = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/infrastructure/ims-noc-overview.json
# The Andon wall refreshes every 5s; nothing may refresh faster against the database.
min_refresh_interval = 5s
versions_to_keep = 20

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org_role = Viewer
viewers_can_edit = false
default_theme = dark
user_invite_max_lifetime_duration = 24h

[auth]
disable_login_form = false
# NOC and Andon screens stay signed in; an idle browser is signed out after 7 days,
# every session after 30 (Grafana's defaults, stated so they are reviewed).
login_maximum_inactive_lifetime_duration = 7d
login_maximum_lifetime_duration = 30d

[auth.basic]
# Scripts (make verify, e2e) use basic auth against the API. New and changed passwords
# need 12+ characters with upper and lower case, a digit and a symbol.
enabled = true
password_policy = true

[auth.anonymous]
enabled = false
# Also hides version and commit from the unauthenticated /api/health.
hide_version = true

[panels]
# Business Text dashboards (Alarm Console ack/resolve, drilling fleet, VCP wall) need
# raw HTML and afterRender JavaScript. Mitigations: only trusted people get Editor,
# templates escape every data value, dashboard-linter rejects {{{ }}} and values in on*=.
disable_sanitize_html = true

[explore]
# Viewers must not run free-form SQL against the plant databases.
enabled = false

[query_history]
enabled = false

[plugins]
allow_loading_unsigned_plugins =
# Plugins are code: they change through this file and a reviewed commit, not the UI.
plugin_admin_enabled = false
# Exactly the panels a provisioned dashboard uses, at the version proven in the stack,
# installed before startup so provisioning never sees a missing panel type.
preinstall_sync = volkovlabs-echarts-panel@7.2.5,marcusolsson-dynamictext-panel@6.3.0
preinstall_auto_update = false
# Grafana 13 otherwise downloads its default app list (trace/log/metrics drilldown,
# Elasticsearch, Zipkin) from the internet at every start; this stack uses none of them.
# preinstall_disabled = true would also skip preinstall_sync above (tested), so they are
# disabled by id instead.
disable_plugins = grafana-exploretraces-app,grafana-lokiexplore-app,grafana-metricsdrilldown-app,grafana-pyroscope-app,elasticsearch,zipkin

[analytics]
# No usage reporting or update checks from the plant network.
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[cloud_migration]
enabled = false

[unified_alerting]
enabled = true
evaluation_timeout = 30s
max_attempts = 3
min_interval = 10s

[feature_toggles]
# JWT-based render auth (default-on in 13.x) 401s against the external
# grafana-image-renderer container's callback request; classic cookie-based
# render-key auth (the path the external renderer expects) works.
renderAuthJWT = false

[log]
mode = console
level = info

[metrics]
# Internal metrics stay on inside the network; nginx refuses /metrics at the front door.
enabled = true
