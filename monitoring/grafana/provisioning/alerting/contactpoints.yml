apiVersion: 1

# Route Grafana-managed alerts to the same Node-RED webhook that Alertmanager
# uses (flows-ubuntu.json: alert_http_in -> /alert-webhook), so telemetry alerts
# reach the engineering team's notification channel.
contactPoints:
  - orgId: 1
    name: ims-node-red-webhook
    receivers:
      - uid: ims-nodered-webhook
        type: webhook
        settings:
          url: http://node-red:1880/alert-webhook
          httpMethod: POST
          # Node-RED rejects the webhook without this; Grafana substitutes
          # the variable from its container environment at provisioning
          authorization_scheme: Bearer
          authorization_credentials: $ALERT_WEBHOOK_TOKEN
        disableResolveMessage: false
