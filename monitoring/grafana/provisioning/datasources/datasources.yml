apiVersion: 1
deleteDatasources:
  - name: TimescaleDB
    orgId: 1
  - name: Prometheus
    orgId: 1
datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    url: ims-pgbouncer:5432
    database: ims
    user: ${GRAFANA_DB_USER}
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: ims
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      maxOpenConns: 20
      maxIdleConns: 5
      connMaxLifetime: 14400
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      httpMethod: POST
      timeInterval: '15s'
  - name: Mentor LDI Database (Read-only)
    uid: mentor-ldi-readonly
    type: postgres
    access: proxy
    url: ${MENTOR_LDI_DB_HOST}:${MENTOR_LDI_DB_PORT}
    database: ${MENTOR_LDI_DB_NAME}
    user: ${MENTOR_LDI_DB_USER}
    editable: false
    isDefault: false
    secureJsonData:
      password: ${MENTOR_LDI_DB_PASSWORD}
    jsonData:
      database: ${MENTOR_LDI_DB_NAME}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
