apiVersion: 1
deleteDatasources:
  - name: TimescaleDB
    orgId: 1
  - name: Drilling TimescaleDB
    orgId: 1
  - name: Prometheus
    orgId: 1
  # Pointed at MENTOR_LDI_DB_* variables that compose never passed in, so it was always
  # an empty, failing data source; no dashboard used it.
  - name: Mentor LDI Database (Read-only)
    orgId: 1
datasources:
  - name: TimescaleDB
    editable: false
    uid: timescaledb
    type: postgres
    access: proxy
    url: ims-pgbouncer:5432
    database: ims
    user: ${GRAFANA_DB_USER}
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: ims
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      maxOpenConns: 20
      maxIdleConns: 5
      connMaxLifetime: 14400
  - name: Drilling TimescaleDB
    editable: false
    uid: drilling-timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: eap_backup
    user: ${GRAFANA_DB_USER}
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: eap_backup
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      maxOpenConns: 20
      maxIdleConns: 5
      connMaxLifetime: 14400
  - name: Prometheus
    editable: false
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      httpMethod: POST
      timeInterval: '15s'
