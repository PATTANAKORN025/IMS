apiVersion: 1

providers:
  - name: 'IMS Dashboards'
    orgId: 1
    folder: 'IMS'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

  - name: 'IMS Set 2 Real DB Dashboards'
    orgId: 1
    folder: 'LDI Set 2'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/set2-dashboards
      foldersFromFilesStructure: false
