apiVersion: 1

providers:
  - name: 'IMS Infrastructure'
    orgId: 1
    folder: 'IMS Infrastructure'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/infrastructure
      foldersFromFilesStructure: false

  - name: 'IMS Manufacturing'
    orgId: 1
    folder: 'IMS Manufacturing'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/manufacturing
      foldersFromFilesStructure: false

  - name: 'Mentor LDI Read-only'
    orgId: 1
    folder: 'Mentor LDI (Read-only)'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/mentor-ldi
      foldersFromFilesStructure: false
