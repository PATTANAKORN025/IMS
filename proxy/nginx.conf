worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate/size mitigation for the 3 BLOCKING Grafana Go-stdlib CVEs
    # (CVE-2026-39821 net/http+idna, CVE-2026-56853 net/http h2c,
    # CVE-2026-56860 net/url quadratic-complexity DoS -- see
    # docs/evidence/SECURITY_REACHABILITY.md). No official patched
    # Grafana build exists yet (checked live: neither 13.1.4 nor 13.2.0
    # contain the fix) -- this does not close the CVEs, it bounds the
    # blast radius: a per-source-IP request-rate cap slows a flood-style
    # DoS attempt by orders of magnitude, and a header/URL size cap
    # bounds the worst-case input size the vulnerable net/url parser
    # (quadratic-complexity bug) ever has to process from a single
    # request, regardless of rate.
    #
    # Sizing is evidence-based, not guessed: real browser network capture
    # this session (docs/evidence/BROWSER_E2E_VERIFICATION.md) measured
    # ~100-115 HTTP requests for a single dashboard page load (panels +
    # datasource queries + static assets). rate=100r/s / burst=2500
    # nodelay gives headroom for ~20 kiosks refreshing in perfect sync
    # behind a shared NAT IP (20 x 115 = 2300) while still capping a
    # sustained single-source flood at 100 req/s -- far above any real
    # kiosk's per-second need (one kiosk's ~115 requests arrive once per
    # its dashboard's refresh interval, typically 5s-1m, i.e. a few req/s
    # average at most) but far below what an attacker needs to hammer the
    # parser at volume. WebSocket live-update frames are NOT subject to
    # this limit -- only the single initial upgrade handshake request
    # counts against it; once upgraded, nginx no longer treats the
    # connection as discrete HTTP requests.
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=grafana_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=ingest_limit:10m rate=50r/s;
    limit_req_status 429;

    # Default is 4x8k; doubled for headroom above real observed dashboard
    # URLs (~150-250 chars with several template-variable query params)
    # while still being a hard, real ceiling -- not unbounded -- against
    # an adversarially large URL/header set crafted to maximize the
    # quadratic-complexity parser's worst case.
    large_client_header_buffers 4 16k;

    # Global security headers. They apply to every location below because no
    # location sets its own add_header (nginx drops inherited add_header
    # directives in any block that declares one). X-XSS-Protection is "0":
    # the legacy browser XSS auditor it controlled is gone, and "1; mode=block"
    # could itself be abused; OWASP now recommends disabling it outright.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Grafana sends its own X-Frame-Options/X-XSS-Protection/X-Content-Type-Options;
    # passing them through alongside the ones above produced two conflicting
    # values per header (seen: "X-Frame-Options: deny" and "SAMEORIGIN").
    # Drop the upstream copies so exactly one policy reaches the browser.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header X-Content-Type-Options;

    # Same-origin front door for Grafana + alarm-api. alarm-api has no
    # published host port of its own (see docker-compose.yaml) -- this is
    # the only path a browser can reach it through, and every request to
    # it must first pass auth_request against Grafana's own session.
    server {
        listen 80;

        # Static proxy_pass hostnames below resolve once at nginx
        # startup/reload and stay cached for the worker's lifetime -- if an
        # upstream container is rebuilt/recreated (new IP) while nginx keeps
        # running, it 502s until nginx is reloaded/restarted. A same-session
        # attempt to fix this with `resolver 127.0.0.11 valid=10s;` + a
        # `set $upstream_x http://...; proxy_pass $upstream_x;` variable
        # indirection (forcing per-request re-resolution) was REVERTED: it
        # traded a rare, dev/rebuild-time 502 (fixed trivially by reloading
        # nginx once) for a frequent, live "invalid URL prefix in ''" 500 on
        # EVERY proxied route whenever the variable's DNS lookup didn't
        # resolve in time -- confirmed in this session's own nginx error
        # log hitting real Alarm Console Ack/Resolve traffic and
        # /factory-twin-3d/ repeatedly within minutes of being deployed.
        # That is a strictly worse failure mode than the one it fixed.
        # Mitigation for the original issue is operational, not code: after
        # `docker compose up -d --build <service>` (or any recreate) of
        # alarm-api / factory-twin-3d / node-red / grafana, run
        # `docker exec ims-proxy nginx -s reload` once.

        # Grafana's session cookie is what proves someone is logged in.
        # auth_request forwards the original request's headers (Cookie
        # included) to this internal location; Grafana's /api/user 200s
        # for a valid session, 401s otherwise. No new auth system --
        # reuses the login the operator already did to see the dashboard.
        location = /auth-check {
            internal;
            proxy_pass http://grafana:3000/api/user;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            # Must match the main location's Host, or Grafana's CSRF check
            # sees Host: grafana:3000 (nginx's proxy_pass default) against
            # the browser's real Origin (http://localhost:3000) and 403s
            # every request that carries an Origin header -- i.e. every
            # real fetch()/XHR from the page, not simple GET navigation.
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Dedicated fast-path health endpoint for Docker health checks & watchdog
        location = /api/health {
            proxy_pass http://grafana:3000/api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Grafana's Prometheus metrics need no login and describe users, dashboards and
        # data sources. Nothing scrapes them through the front door, so it refuses them.
        location = /metrics {
            return 404;
        }

        # Fast-path login session ping for Grafana reconnect watchdog
        location = /api/login/ping {
            proxy_pass http://grafana:3000/api/login/ping;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Dedicated WebSocket reverse proxy for Grafana Live (/api/live/ws)
        # Prevents premature closing, bypasses rate limiting, enables persistent streaming
        location /api/live/ {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # connecting to grafana takes milliseconds; only the open socket needs the long timeouts below
            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
        }

        location /alarm-api/ {
            auth_request /auth-check;
            proxy_pass http://alarm-api:4000/;
            proxy_set_header Host $host;
        }

        # Task 4.1 3D Digital Twin POC (LDI-01 only, read-only) -- same
        # auth_request gate against Grafana's own session as /alarm-api/
        # above, copied verbatim in shape.
        location /factory-twin-3d/ {
            auth_request /auth-check;
            proxy_pass http://factory-twin-3d:4100/;
            proxy_set_header Host $host;
        }

        # HTTP Ingestion endpoints for external LDI machines
        location /ldi-telemetry {
            limit_req zone=ingest_limit burst=100 nodelay;
            proxy_pass http://node-red:1880/ldi-telemetry;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /inject {
            limit_req zone=ingest_limit burst=100 nodelay;
            proxy_pass http://node-red:1880/inject;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=grafana_limit burst=2500 nodelay;
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
