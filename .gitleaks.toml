title = "IMS gitleaks config"

# Extend the built-in ruleset (AWS keys, PEM blocks, Slack/GitHub tokens, etc.)
[extend]
useDefault = true

[allowlist]
description = "Example placeholders and vendored deps are not real secrets"
# .env is allowlisted only because CI copies .env.example to .env right before this
# scan; scripts/pre-commit.js refuses to commit any .env file. Flows, docs and
# READMEs are scanned (they were allowlisted until 2026-09-29 and scan clean).
paths = [
  '''\.env$''',
  '''\.env\.example''',
  '''\.gitleaks\.toml''',
  '''(^|/)node_modules/''',
  '''(^|/)\.playwright-mcp/''',
]
regexes = [
  '''change-me-please''',
  '''your-line-notify-token-here''',
  '''generate-a-random-webhook-secret-here''',
  '''YOUR/WEBHOOK/URL''',
  '''apex_mock''',
]
