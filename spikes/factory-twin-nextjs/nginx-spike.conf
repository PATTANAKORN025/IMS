# DISPOSABLE spike config -- never applied to the real proxy/nginx.conf.
# Reproduces exactly the parts of proxy/nginx.conf's real
# `location /factory-twin-3d/` block that matter for this question (the
# auth_request directive shape and the proxy_pass trailing-slash behavior),
# against the spike Next.js build running on the host at :4300. The
# /auth-check upstream is stubbed with `return 200` instead of proxying to
# a real Grafana -- auth_request's pass/fail plumbing is identical either
# way; only the upstream's answer differs, and that answer is orthogonal to
# the basePath question this file exists to test.

server {
  listen 8081;

  location = /auth-check {
    internal;
    return 200;
  }

  # STRIP-PREFIX variant -- byte-for-byte the same proxy_pass shape
  # proxy/nginx.conf uses today (trailing slash on the upstream URL strips
  # the matched prefix before forwarding).
  location /factory-twin-3d/ {
    auth_request /auth-check;
    proxy_pass http://host.docker.internal:4300/;
    proxy_set_header Host $host;
  }
}

server {
  # PASS-THROUGH variant, WITHOUT the no-trailing-slash helper -- i.e. the
  # real proxy/nginx.conf's exact structure today, with only the
  # proxy_pass trailing slash removed. Expected to demonstrate the dead
  # end: Next's own 308 sends the browser to a URI this server has no
  # location for.
  listen 8082;

  location = /auth-check {
    internal;
    return 200;
  }

  location /factory-twin-3d/ {
    auth_request /auth-check;
    proxy_pass http://host.docker.internal:4300;
    proxy_set_header Host $host;
  }
}

server {
  # PASS-THROUGH variant WITH the no-trailing-slash helper -- the fix this
  # spike concludes is required, not optional, before a real cutover.
  listen 8083;

  location = /auth-check {
    internal;
    return 200;
  }

  location /factory-twin-3d/ {
    auth_request /auth-check;
    proxy_pass http://host.docker.internal:4300;
    proxy_set_header Host $host;
  }

  location = /factory-twin-3d {
    auth_request /auth-check;
    proxy_pass http://host.docker.internal:4300;
    proxy_set_header Host $host;
  }
}
