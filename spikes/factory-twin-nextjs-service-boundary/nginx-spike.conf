# Step 8 DISPOSABLE spike config -- never applied to proxy/nginx.conf.
# Reuses the proven Step 2 shape (docs/evidence/FACTORY_TWIN_NEXTJS_PROXY_SPIKE.md,
# spikes/factory-twin-nextjs/nginx-spike.conf's own :8083 variant, the ONE that
# worked end-to-end) against the REAL factory-twin-3d-next containerized
# service (ft-next-spike, published on host :4320) instead of a bare host
# process, to prove the finding still holds for the actual container.

server {
  listen 8090;

  location = /auth-check {
    internal;
    return 200;
  }

  # Pass-through (no trailing slash -- Next needs to see its own basePath)
  # + the exact-match no-trailing-slash catch, the two changes Step 2's
  # spike concluded are required.
  location /factory-twin-3d/ {
    auth_request /auth-check;
    proxy_pass http://host.docker.internal:4320;
    proxy_set_header Host $host;
  }

  location = /factory-twin-3d {
    auth_request /auth-check;
    proxy_pass http://host.docker.internal:4320;
    proxy_set_header Host $host;
  }
}

server {
  # Auth-boundary check: auth-check returns 401 here instead of 200, to
  # prove a failing auth_request actually blocks the upstream (never
  # tested by the Step 2 spike, which only ever stubbed a passing check).
  listen 8091;

  location = /auth-check {
    internal;
    return 401;
  }

  location /factory-twin-3d/ {
    auth_request /auth-check;
    proxy_pass http://host.docker.internal:4320;
    proxy_set_header Host $host;
  }

  location = /factory-twin-3d {
    auth_request /auth-check;
    proxy_pass http://host.docker.internal:4320;
    proxy_set_header Host $host;
  }
}
