# IMS Production Overlay
# Usage: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d

services:
  node-red:
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  grafana:
    environment:
      - GF_LOG_LEVEL=warn
      - GF_PANELS_DISABLE_SANITIZE_HTML=false
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  timescaledb:
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

  prometheus:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  proxy:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  alarm-api:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
