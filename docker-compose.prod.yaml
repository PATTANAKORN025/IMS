# IMS Production Overlay
# Usage: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d

services:
  node-red:
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  grafana:
    environment:
      - GF_LOG_LEVEL=warn
      # This overlay only sets resource limits and log level. It deliberately does
      # not flip GF_SECURITY_COOKIE_SECURE / GF_SECURITY_STRICT_TRANSPORT_SECURITY:
      # the proxy serves plain HTTP, and a Secure cookie is never sent back over
      # HTTP from a non-localhost address -- every login would loop and alarm-api
      # auth would fail. Turn both on only once the proxy terminates TLS.
      # GF_PANELS_DISABLE_SANITIZE_HTML stays as in the base file: the Business
      # Text dashboards (Alarm Console ack/resolve, drilling fleet, VCP wall) need it.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  timescaledb:
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

  prometheus:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  proxy:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  alarm-api:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
