# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# IMS — Industrial NOC Monitoring System
# Phase 2: Zero-Risk Architecture with PgBouncer + Secrets
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &default-restart
  restart: unless-stopped

# A process in the container can never gain privileges through setuid binaries
# or file capabilities (e.g. after a compromise).
x-hardening: &default-hardening
  security_opt:
    - no-new-privileges:true

# No Linux capabilities: none of these services binds a port below 1024, changes
# file ownership or switches user at runtime, so a compromised process gets no
# kernel privileges back. timescaledb, proxy and pgadmin keep the default set
# because their entrypoints chown data directories and drop to another user.
x-no-caps: &no-caps
  cap_drop:
    - ALL

x-healthcheck-defaults: &healthcheck-defaults
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

x-resource-small: &resource-small
  cpus: '0.5'
  memory: 256M

x-resource-medium: &resource-medium
  cpus: '1.0'
  memory: 1G

x-resource-large: &resource-large
  cpus: '2.0'
  memory: 2G

services:
  # ── TimescaleDB ───────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg16
    container_name: ims-timescaledb
    # parallel query uses /dev/shm; the Docker default of 64 MB is too small for it
    shm_size: 256mb
    <<: [*default-restart, *default-hardening]
    init: true
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD required in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - timezone=${TZ:-UTC}
      - -c
      # worker slots: TimescaleDB jobs and parallel query share max_worker_processes. At 8
      # (with 32 asked for TimescaleDB) jobs logged "failed to start" after every restart.
      - timescaledb.max_background_workers=8
      - -c
      - max_worker_processes=16
      - -c
      - max_parallel_workers=2
      # JIT compiled thousands of functions for a 0-row SPC query and took it from under a second to 45 s;
      # dashboard queries here are short, so compilation only costs CPU (migration 083)
      - -c
      - jit=off
      # an abandoned transaction may not hold locks and snapshots for more than 5 minutes
      - -c
      - idle_in_transaction_session_timeout=5min
      # log anything slower than 5 s, and lock waits, so a pile-up is visible early
      - -c
      - log_min_duration_statement=5s
      - -c
      - log_lock_waits=on
      # Disable outbound telemetry in air-gapped / enterprise industrial network
      - -c
      - timescaledb.telemetry_level=off
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # ports:
    #   - "127.0.0.1:${PGPORT:-5432}:5432"
    deploy:
      resources:
        limits: *resource-large
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      #<<: *healthcheck-defaults
    networks:
      - ims-internal
    logging: *default-logging

  # ── PgBouncer (Connection Pooler) ─────────────────────────
  pgbouncer:
    build:
      context: ./pgbouncer
    container_name: ims-pgbouncer
    <<: [*default-restart, *default-hardening, *no-caps]
    init: true
    entrypoint: ["/bin/sh", "/etc/pgbouncer/entrypoint-wrapper.sh"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${PGPORT:-5432} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      DATABASE_URLS: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB},postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/eap_backup
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD required in .env}
      ALARM_API_DB_PASSWORD: ${ALARM_API_DB_PASSWORD:?ALARM_API_DB_PASSWORD required in .env}
      NODERED_DB_PASSWORD: ${NODERED_DB_PASSWORD:?NODERED_DB_PASSWORD required in .env}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      SERVER_IDLE_TIMEOUT: 300
      CLIENT_IDLE_TIMEOUT: 300
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      # clients prove the password with SCRAM; nothing crosses the network in cleartext
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,statement_timeout
    volumes:
      - ./pgbouncer/entrypoint-wrapper.sh:/etc/pgbouncer/entrypoint-wrapper.sh:ro
    deploy:
      resources:
        limits: *resource-small
        reservations:
          cpus: '0.1'
          memory: 64M
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - ims-internal
    logging: *default-logging

  # ── Prometheus ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: ims-prometheus
    <<: [*default-restart, *default-hardening, *no-caps]
    init: true
    user: "nobody:nobody"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:${PROMETHEUS_PORT:-9090}"
    deploy:
      resources:
        limits: *resource-medium
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      alertmanager:
        condition: service_started
    networks:
      - ims-internal
      - ims-monitoring
    logging: *default-logging

  # ── Alertmanager ──────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: ims-alertmanager
    <<: [*default-restart, *default-hardening, *no-caps]
    init: true
    user: "nobody:nobody"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    # bearer token for Node-RED's /alert-webhook, read via credentials_file
    secrets:
      - alert_webhook_token
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:${ALERTMANAGER_PORT:-9093}"
    deploy:
      resources:
        limits: *resource-small
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - ims-internal
      - ims-monitoring
    logging: *default-logging

  # ── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.1.2
    container_name: ims-grafana
    <<: [*default-restart, *default-hardening, *no-caps]
    init: true
    user: "472:472"
    environment:
      TZ: ${TZ:-UTC}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:?GRAFANA_DB_USER required in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD required in .env}
      # Everything else (security, plugins, sanitize, home dashboard, log level) is in
      # monitoring/grafana/grafana.ini; only secrets and per-deployment values live here.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      # contact point bearer token for Node-RED's /alert-webhook
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?set ALERT_WEBHOOK_TOKEN in .env}
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      # Grafana's own container port, not the host port GRAFANA_PORT publishes on
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${GRAFANA_RENDERER_TOKEN:?set GRAFANA_RENDERER_TOKEN in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/plugins:/var/lib/grafana/plugins
    # No host port published -- reached only via the proxy service below,
    # so every request (including to alarm-api) goes through one
    # same-origin front door and can carry Grafana's session cookie.
    deploy:
      resources:
        limits: *resource-large
        reservations:
          cpus: '0.5'
          memory: 256M
    depends_on:
      timescaledb:
        condition: service_healthy
      prometheus:
        condition: service_started
      alertmanager:
        condition: service_started
      renderer:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ims-internal
      - ims-monitoring
    logging: *default-logging

  # ── Proxy (same-origin front door: Grafana + auth-gated alarm-api) ──
  proxy:
    image: nginx:1.31-alpine
    container_name: ims-proxy
    <<: [*default-restart, *default-hardening]
    init: true
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GRAFANA_PORT:-3000}:80"
    deploy:
      resources:
        limits: *resource-small
        reservations:
          cpus: '0.1'
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/health || exit 1"]
      <<: *healthcheck-defaults
    depends_on:
      grafana:
        condition: service_healthy
      alarm-api:
        condition: service_healthy
      factory-twin-3d:
        condition: service_healthy
    networks:
      - ims-internal
    logging: *default-logging

  # ── Grafana Image Renderer ───────────────────────────────
  renderer:
    # pinned to the version proven in the running stack; Dependabot proposes upgrades
    image: grafana/grafana-image-renderer:v5.12.4
    container_name: ims-grafana-renderer
    <<: [*default-restart, *default-hardening, *no-caps]
    environment:
      TZ: ${TZ:-UTC}
      ENABLE_METRICS: "false"
      AUTH_TOKEN: ${GRAFANA_RENDERER_TOKEN:?set GRAFANA_RENDERER_TOKEN in .env}
    deploy:
      resources:
        limits: *resource-medium
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - ims-internal
    logging: *default-logging

  # ── SNMP Simulator ────────────────────────────────────────
  snmpsim:
    image: tandrup/snmpsim:v0.4
    container_name: ims-snmpsim
    <<: [*default-restart, *default-hardening, *no-caps]
    init: true
    # binds UDP 161 as root, then switches to nobody:nogroup
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    entrypoint: ["python", "/usr/local/bin/snmpsimd.py"]
    command:
      - --data-dir=/data
      - --agent-udpv4-endpoint=0.0.0.0:${SNMP_PORT:-161}
      - --force-index-rebuild
      - --process-user=nobody
      - --process-group=nogroup
    volumes:
      - ./monitoring/snmpsim:/data:ro
    deploy:
      resources:
        limits: *resource-small
        reservations:
          cpus: '0.1'
          memory: 32M
    networks:
      - ims-internal
    logging: *default-logging

  # ── Blackbox Exporter (Uptime/SLA Probes) ─────────────────
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: ims-blackbox
    <<: [*default-restart, *default-hardening, *no-caps]
    init: true
    user: root
    cap_add:
      - NET_RAW
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "127.0.0.1:${BLACKBOX_PORT:-9115}:${BLACKBOX_PORT:-9115}"
    deploy:
      resources:
        limits: *resource-small
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - ims-internal
      - ims-monitoring
    logging: *default-logging


  # ── Database Migrations (one-shot init container) ──────────
  db-migrate:
    image: timescale/timescaledb:2.29.2-pg16
    container_name: ims-db-migrate
    restart: "no"
    <<: [*default-hardening, *no-caps]
    init: true
    entrypoint: ["/bin/sh", "/scripts/migrate-entrypoint.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGHOST: timescaledb
      ALARM_API_DB_PASSWORD: ${ALARM_API_DB_PASSWORD:?set ALARM_API_DB_PASSWORD in .env}
      # migration 087 sets these roles' passwords
      NODERED_DB_PASSWORD: ${NODERED_DB_PASSWORD:?set NODERED_DB_PASSWORD in .env}
      ARCHIVER_DB_PASSWORD: ${ARCHIVER_DB_PASSWORD:?set ARCHIVER_DB_PASSWORD in .env}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./scripts/migrate-entrypoint.sh:/scripts/migrate-entrypoint.sh:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - ims-internal
    logging: *default-logging

  # ── Alarm API (operator ack/resolve write path) ────────────
  alarm-api:
    build:
      context: ./services/alarm-api
    container_name: ims-alarm-api
    <<: [*default-restart, *default-hardening, *no-caps]
    init: true
    # The process writes nothing to its own filesystem; a read-only root means an
    # exploit cannot drop or modify files there either.
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PGHOST: ims-pgbouncer
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: alarm_api_writer
      PGPASSWORD: ${ALARM_API_DB_PASSWORD:?set ALARM_API_DB_PASSWORD in .env}
      ALARM_API_ALLOWED_ORIGIN: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      PORT: "4000"
    # No host port published -- reachable only through the proxy service's
    # /alarm-api/ path, which is auth_request-gated on Grafana's own
    # session. Direct access to :4000 from outside the docker network is
    # no longer possible.
    deploy:
      resources:
        limits: *resource-small
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      <<: *healthcheck-defaults
    depends_on:
      pgbouncer:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - ims-internal
    logging: *default-logging

  # ── Factory 3D Digital Twin (Task 4.1 POC -- LDI-01 only, read-only) ──
  factory-twin-3d:
    build:
      context: ./services/factory-twin-3d
    container_name: ims-factory-twin-3d
    <<: [*default-restart, *default-hardening, *no-caps]
    init: true
    # The process writes nothing to its own filesystem; a read-only root means an
    # exploit cannot drop or modify files there either.
    read_only: true
    tmpfs:
      - /tmp
    # Read-only mount, host-only, never baked into the image (see
    # Dockerfile's comment). This repo's own checkout has nothing real
    # here -- services/factory-twin-3d/private/ is gitignored -- so a
    # public clone runs with this mount pointing at an empty directory and
    # server.js's loadPrivateLayout() falls back to the synthetic grid.
    # A private production environment drops a real LayoutApex3-F1.json
    # (and/or a reference image) at this same host path, no rebuild needed.
    volumes:
      - ./services/factory-twin-3d/private:/app/private:ro
    environment:
      PGHOST: ims-pgbouncer
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      # Read-only service, no write path -- reuses the existing grafana_reader
      # role (postgres/init/002-grafana-readonly.sql) instead of provisioning
      # a new DB role/migration for a 1-machine POC (see Task 4.1 brief's
      # scope-minimization decision).
      PGUSER: ${GRAFANA_DB_USER:?GRAFANA_DB_USER required in .env}
      PGPASSWORD: ${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD required in .env}
      PORT: "4100"
    # No host port published -- reachable only through the proxy service's
    # /factory-twin-3d/ path, which is auth_request-gated on Grafana's own
    # session, same pattern as alarm-api.
    deploy:
      resources:
        limits: *resource-small
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4100/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      <<: *healthcheck-defaults
    depends_on:
      pgbouncer:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - ims-internal
    logging: *default-logging

  # ── Node-RED ──────────────────────────────────────────────
  node-red:
    build:
      context: ./nodered_data
      dockerfile: Dockerfile
    container_name: ims-node-red
    <<: [*default-restart, *default-hardening, *no-caps]
    init: true
    user: "1000:1000"
    environment:
      TZ: ${TZ:-UTC}
      NODE_PATH: /usr/src/node_modules
      NODE_RED_ENABLE_PROJECTS: "false"
      NODE_OPTIONS: "--max-old-space-size=2048"
      CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:?set NODE_RED_CREDENTIAL_SECRET in .env}
      NODE_RED_ADMIN_USER: ${NODE_RED_ADMIN_USER:-admin}
      NODE_RED_ADMIN_PASSWORD_HASH: ${NODE_RED_ADMIN_PASSWORD_HASH:-}
      PGHOST: ims-pgbouncer
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      # nodered_writer (migration 087): only the tables the flows write,
      # not the superuser
      PGUSER: nodered_writer
      PGPASSWORD: ${NODERED_DB_PASSWORD:?set NODERED_DB_PASSWORD in .env}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?set ALERT_WEBHOOK_TOKEN in .env}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_USER_ID: ${LINE_USER_ID:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_TYPE: ${TEAMS_WEBHOOK_TYPE:-AdaptiveCard}
      INGEST_API_KEY: ${INGEST_API_KEY:?set INGEST_API_KEY in .env}
      LDI_SIMULATOR_ENABLED: ${LDI_SIMULATOR_ENABLED:-true}
      LDI_SIM_AUTO_LIFECYCLE: ${LDI_SIM_AUTO_LIFECYCLE:-true}
    ports:
      - "127.0.0.1:${NODE_RED_PORT:-1880}:${NODE_RED_PORT:-1880}"
    volumes:
      - ./nodered_data:/data
    deploy:
      resources:
        limits: *resource-large
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "const http=require('http');const req=http.get('http://127.0.0.1:${NODE_RED_PORT:-1880}/metrics',res=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.setTimeout(3000,()=>{req.destroy();process.exit(1);});"
      <<: *healthcheck-defaults
      start_period: 45s
    depends_on:
      timescaledb:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      grafana:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    networks:
      - ims-internal
    logging: *default-logging

  # ── Observability Archiver (durable restart/crash-log evidence) ────
  # Closes the gap found investigating the 2026-08-13 16h simulator outage:
  # Docker's own json-file log driver had already rotated past it by the
  # time anyone looked, and there was no restart record outside the soak
  # script's own 15-min poll of 3 containers. This subscribes to `docker
  # events` directly (rotation-independent) and durably records restarts
  # to both a host file and public.container_restart_audit, plus tails
  # each critical container's logs into their own non-rotating host file.
  observability-archiver:
    build:
      context: ./services/observability-archiver
    container_name: ims-observability-archiver
    <<: [*default-restart, *default-hardening, *no-caps]
    init: true
    environment:
      # observability_archiver (migration 087): INSERT on
      # container_restart_audit only, not the superuser
      POSTGRES_USER: observability_archiver
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGPASSWORD: ${ARCHIVER_DB_PASSWORD:?set ARCHIVER_DB_PASSWORD in .env}
      PGHOST: timescaledb
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - ./scripts/observability-archiver.sh:/scripts/observability-archiver.sh:ro
      - ./ops-logs:/archive
    depends_on:
      timescaledb:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    networks:
      - ims-internal
      - ims-docker-api
    logging: *default-logging

  # ── Docker API proxy (read-only) ──────────────────────────
  # The archiver needs container events and logs. Mounting the socket gave it
  # the whole Docker API -- ':ro' on a socket does not stop API writes, so
  # that was root on the host. This proxy answers GET on /events and
  # /containers only (POST=0); everything else is denied. It sits on its own
  # internal network that only the archiver joins.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: ims-docker-socket-proxy
    <<: [*default-restart, *default-hardening, *no-caps]
    environment:
      CONTAINERS: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ims-docker-api
    logging: *default-logging

  # ── pgAdmin 4 ─────────────────────────────────────────────
  pgadmin:
    # pinned to the version proven in the running stack; Dependabot proposes upgrades
    image: dpage/pgadmin4:9.18
    container_name: ims-pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?set in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set in .env}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      GUNICORN_THREADS: 4
      PGADMIN_CONFIG_MAX_QUERY_HIST_STORED: 50
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 20
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: 'False'
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 128M
    networks:
      - ims-internal
    depends_on:
      - timescaledb
    logging: *default-logging

secrets:
  alert_webhook_token:
    environment: ALERT_WEBHOOK_TOKEN

volumes:
  timescaledb_data:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  grafana_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  ims-internal:
    driver: bridge
  ims-monitoring:
    driver: bridge
  # archiver <-> docker-socket-proxy only; no route out
  ims-docker-api:
    driver: bridge
    internal: true
