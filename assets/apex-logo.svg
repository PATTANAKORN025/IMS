<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030407" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="120" rx="16" fill="url(#bg)" stroke="#00F2FE" stroke-opacity="0.2" stroke-width="2"/>
  <text x="200" y="65" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">APEX</text>
  <text x="200" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8892b0" text-anchor="middle" letter-spacing="2">CIRCUIT (THAILAND)</text>
</svg>
