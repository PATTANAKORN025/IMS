name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The workflow token can read the repository and nothing else; a compromised
# step or dependency cannot push, tag or comment with it.
permissions:
  contents: read

jobs:
  verify-flows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Verify flows.json is up-to-date
        run: |
          node scripts/build-flows.js
          git diff --exit-code nodered_data/flows.json
