name: IMS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  NODERED_URL: http://127.0.0.1:1880
  INGEST_API_KEY: ims-secret-key
  GRAFANA_USER: admin
  GRAFANA_PASS: admin

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage 1: Lint & Static Analysis
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for confidential private facility data
        run: node tests/lint/private-data-leak-scanner.js

      - name: Repo hygiene (block plugin bundles, source maps, binaries, oversized files)
        run: node tests/lint/repo-hygiene-linter.js
        # Structural/path-based only (private/ directory segments, the
        # Apex3Layout name, CAD extensions, this repo's own private-data
        # filenames) -- never reads file contents or a real facility
        # identifier. Runs before any other step since a leak here matters
        # more than any other lint result.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        # Needed from here on: alert-rule-linter.js is the first lint script
        # in this job with an actual npm dependency (js-yaml). The other
        # lint scripts below are dependency-free by design and would run
        # fine without this step, but a shared job needs one install path.

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Lint Grafana Dashboards
        run: node tests/lint/dashboard-linter.js

      - name: Lint RCA Alarm-Category Coverage
        run: node tests/lint/rca-mapping-coverage.js

      - name: Lint Query Budget (tiering contract)
        run: node tests/lint/query-budget-linter.js

      - name: Lint Alert Rules (ORDER BY on time_series queries)
        run: node tests/lint/alert-rule-linter.js

      - name: Validate Floor 1 private geometry (skips cleanly if absent)
        run: node tests/lint/floor1-geometry-validator.js

      - name: Check Dashboard Inventory is up to date
        run: node scripts/generate-dashboard-inventory.js --check
        # Fails if docs/architecture/DASHBOARD_INVENTORY.md doesn't match
        # what monitoring/grafana/dashboards/*.json currently says -- the
        # single-source-of-truth gate for panel counts/descriptions that
        # used to drift silently in hand-typed README/ARCHITECTURE tables.

      - name: Lint Doc Over-Claims (dashboard/service/migration counts)
        run: node tests/lint/doc-overclaim-linter.js
        # Catches the exact drift class found in the 2026-08-13 doc audit --
        # hardcoded counts in prose that go stale next time a dashboard,
        # service, or migration is added.

      - name: Lint Prometheus Config
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v ${{ github.workspace }}/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml \
            -v ${{ github.workspace }}/monitoring/prometheus/rules:/etc/prometheus/rules \
            prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Lint Prometheus Alert Rules
        run: |
          for f in monitoring/prometheus/rules/*.yml; do
            docker run --rm \
              --entrypoint promtool \
              -v "${{ github.workspace }}/monitoring/prometheus/rules:/etc/prometheus/rules" \
              prom/prometheus:v2.55.1 \
              check rules "/etc/prometheus/rules/$(basename $f)"
          done

      - name: Validate Node-RED Flow JSON
        run: |
          for f in nodered_data/flows/*.json; do
            python3 -c "import json; f=json.load(open('$f')); print(f'VALID: {len(f)} nodes')"
          done

      - name: Secret Scan (gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --redact --verbose \
            --config=/repo/.gitleaks.toml --exit-code 1 || true

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage 2: Unit Tests
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Run Parser Tests
        run: node tests/unit/parser.test.js

      - name: Run V2 Parser Tests (Chaos & Boundary)
        run: node tests/unit/v2-parser.test.js

      - name: Run Counter Wraparound Tests
        run: node tests/unit/counter-wraparound.test.js

      - name: Run Boundary Validation Tests
        run: node tests/unit/boundary-validation.test.js

      - name: Run Circuit Breaker Tests
        run: node tests/unit/circuit-breaker.test.js

      - name: Run Gate Decision Tests
        run: node tests/unit/gate.test.js

      # Factory Twin contract suites. These encode the system's REFUSALS --
      # that an observation cannot be promoted to a confirmation, that a
      # mapping cannot be inferred from proximity or a property lookup, that
      # an unvalidated zone cannot render, that no private field can reach the
      # wire. They ran only in the local pre-commit hook, so a change that
      # deleted a refusal passed CI. Enforced here for the same reason the
      # leak scanner runs before everything else: these are the guarantees,
      # not incidental coverage.
      - name: Run Factory Twin Mapping Contract Tests
        run: node tests/unit/factory-twin-mapping.test.js

      - name: Run Factory Twin MES Import Boundary Tests
        run: node tests/unit/factory-twin-mes-import.test.js

      - name: Run Factory Twin Geometry Mutation Tests
        run: node tests/unit/factory-twin-geometry-mutation.test.js

      - name: Run Factory Twin Diagnostics Sanitization Tests
        run: node tests/unit/factory-twin-diagnostics.test.js

      - name: Run Factory Twin Evidence Pipeline Tests
        run: node tests/unit/factory-twin-evidence.test.js

      - name: Run Factory Twin Wire Projection Tests
        run: node tests/unit/factory-twin-wire.test.js

      - name: Run Factory Twin Schematic Layer Tests
        run: node tests/unit/factory-twin-schematic.test.js

      - name: Run Factory Twin Floor Registry Tests
        run: node tests/unit/factory-twin-floors.test.js

      - name: Run Factory Twin Operational Status Tests
        run: node tests/unit/factory-twin-operational-status.test.js

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage 3: Integration & Chaos Test
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  integration-chaos:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Seed environment
        run: cp .env.example .env

      - name: Build and start minimal stack
        run: |
          docker compose build node-red
          docker compose up -d timescaledb node-red
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Verify Node-RED is running
        run: |
          curl -sf http://127.0.0.1:1880/ || (echo "Node-RED not ready"; docker logs ims-node-red; exit 1)
          echo "Node-RED: OK"

      - name: Verify TimescaleDB is running
        run: |
          docker exec ims-timescaledb pg_isready -U ims_admin -d ims || (echo "TimescaleDB not ready"; exit 1)
          echo "TimescaleDB: OK"

      - name: Run E2E Smoke Test
        run: bash tests/smoke/db-write-check.sh

      - name: Run Query Budget Check
        run: bash tests/smoke/query-budget-check.sh

      - name: Run Panel Data Check (layer C — actual query results, not just syntax)
        run: node tests/e2e/panel-data-check.js
        # Default (non-strict) mode: SQL errors still fail the build, but
        # zero-rows/missing-time-column are warnings only here -- this stage's
        # DB has had the simulator running for all of ~30s, nowhere near
        # enough history for every panel's window to have data yet (same
        # reasoning tests/smoke/query-budget-check.sh documents for its own
        # budget). Run with STRICT_DATA_CHECK=1 against a dev/staging DB with
        # real accumulated history to enforce the zero-rows check for real.

      - name: Run Query Timing Check (World-Class Audit Phase 4/7)
        run: node tests/e2e/query-timing-check.js
        # Real server-side EXPLAIN ANALYZE timing, P95 < 80ms budget. Low
        # data volume this early in a fresh CI run only makes queries
        # faster, not slower, so this is safe as a hard gate here even
        # though it won't validate at-scale performance.

      - name: Run Schema Drift Check (World-Class Audit Phase 1/7)
        run: |
          OUT=$(bash scripts/migrate.sh 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "Pending: 0  Applied: 0  Failed: 0" || (echo "Schema drift detected -- migrations directory doesn't match schema_migrations"; exit 1)

      - name: Run Orphan Object Check (World-Class Audit Phase 2/7)
        run: node tests/lint/orphan-object-linter.js

      - name: Check Database Schema Inventory is up to date
        run: node scripts/generate-schema-inventory.js --check
        # Needs a live, migrated DB (has one at this point in the job) --
        # fails if docs/architecture/DATABASE_SCHEMA.md doesn't match what
        # information_schema / timescaledb_information.* currently say.

      - name: Run Golden-Dataset SPC Validation
        run: node tests/e2e/golden-dataset-spc.js
        # Unlike the panel data check above, this needs no accumulated
        # history -- it inserts its own known dataset in a transaction and
        # rolls back unconditionally, so it's fully deterministic and safe
        # to run as a hard failure gate even on a freshly-started CI stack.

      - name: Run Chaos Stress Test (K6)
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/tests/k6:/scripts \
            grafana/k6:latest run \
            --vus 50 \
            --duration 2m \
            -e NODERED_URL=http://127.0.0.1:1880 \
            -e INGEST_API_KEY=ims-secret-key \
            /scripts/chaos-stress.js \
            --summary-export=/scripts/chaos-ci-results.json || true

      - name: Upload chaos results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-stress-results
          path: tests/k6/chaos-ci-results.json
          if-no-files-found: warn

      - name: Teardown
        if: always()
        run: docker compose down -v

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage 4a: Factory Twin browser regression
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Runs the twin through the proxy, behind Grafana's auth_request gate --
  # the path a real user takes, and the one that cannot be exercised on a
  # workstation whose Grafana admin password has been changed since its
  # database was initialised. CI starts from .env.example against a fresh
  # database, so the authenticated path genuinely runs here.
  #
  # Private geometry is gitignored and therefore absent. The suite reconciles
  # the scene against what the API actually served, so an empty deployment
  # still verifies the boundary, the evidence semantics and the layer
  # behaviour; the checks that need an envelope report SKIP with a reason and
  # are never counted as passing.
  factory-twin-regression:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed environment
        run: cp .env.example .env

      - name: Start twin behind the proxy
        run: |
          docker compose up -d timescaledb pgbouncer grafana factory-twin-3d proxy
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:3000/api/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/health >/dev/null || (echo "Grafana not ready"; docker logs ims-grafana; exit 1)
          # nginx resolves upstream hostnames once at startup, so a container
          # that came up after it is otherwise a 502.
          docker exec ims-proxy nginx -s reload

      - name: Factory Twin browser regression (authenticated, 5 viewports)
        env:
          GRAFANA_URL: http://127.0.0.1:3000
          GRAFANA_ADMIN_USER: admin
          GRAFANA_ADMIN_PASSWORD: change-me-please
        run: node tests/playwright/factory-twin-regression.js

      - name: Factory Twin failure-mode regression
        env:
          GRAFANA_URL: http://127.0.0.1:3000
          GRAFANA_ADMIN_USER: admin
          GRAFANA_ADMIN_PASSWORD: change-me-please
        run: node tests/playwright/factory-twin-failure-modes.js

      - name: Factory Twin inspector E2E (real click -> identity gate)
        env:
          GRAFANA_URL: http://127.0.0.1:3000
          GRAFANA_ADMIN_USER: admin
          GRAFANA_ADMIN_PASSWORD: change-me-please
        run: node tests/playwright/factory-twin-inspector-e2e.js

      - name: Twin service logs on failure
        if: failure()
        run: docker logs ims-factory-twin-3d --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage 4: LDI Visual / Layout Regression
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Structural checks (panel errors, no-scroll overflow), not pixel-diff --
  # see the header comment in tests/playwright/ldi-responsive-regression.js
  # for why: these dashboards show live, constantly-changing mock data
  # (timestamps, sparkline positions), so byte-identical screenshots across
  # two runs are never expected even with zero code changes. Pixel-diff
  # regression here would need a frozen/mocked dataset first, which is a
  # separate follow-up, not something to bolt on silently.
  visual-regression:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed environment
        run: cp .env.example .env

      - name: Start full stack
        run: |
          docker compose up -d timescaledb node-red grafana renderer
          echo "Waiting for Grafana to be healthy..."
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/health || (echo "Grafana not ready"; docker logs ims-grafana; exit 1)
          # Let the simulator emit a little data so panels aren't universally
          # empty; no-data panels are reported but don't fail this check
          # (see script header), so this only needs to be short.
          sleep 20

      - name: Run LDI responsive/layout regression check
        env:
          GRAFANA_URL: http://127.0.0.1:3000
          GRAFANA_ADMIN_USER: admin
          GRAFANA_ADMIN_PASSWORD: change-me-please
        run: node tests/playwright/ldi-responsive-regression.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ldi-visual-regression-screenshots
          path: tests/playwright/screenshots/ldi-responsive/
          if-no-files-found: warn

      - name: Teardown
        if: always()
        run: docker compose down -v

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage 5: Summary
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  summary:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-chaos, visual-regression]
    if: always()
    steps:
      - name: Pipeline Summary
        run: |
          echo "## IMS CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Static Analysis | ${{ needs.lint.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration & Chaos | ${{ needs.integration-chaos.result == 'success' && '✅ Pass' || '⚠️ Partial' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| LDI Visual/Layout Regression | ${{ needs.visual-regression.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Generated by IMS CI/CD Pipeline*" >> $GITHUB_STEP_SUMMARY
